<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi System Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 50px;
        }

        .section-header {
            text-align: center;
            margin-top: 30px;
            font-weight: 600;
        }

        .btn-custom {
            font-size: 14px;
            padding: 12px 25px;
            border-radius: 30px;
            margin-top: 15px;
            width: 100%;
        }

        .navbar-custom {
            background-color: #343a40;
        }

        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link {
            color: #fff;
        }

        .navbar-custom .nav-link:hover {
            color: #d1d1d1;
        }

        .modal-header {
            background-color: #343a40;
            color: white;
        }

        .card-header {
            background-color: #f8f9fa;
            font-weight: bold;
        }

        .card-body {
            padding: 1.5rem;
        }

        .card-footer {
            background-color: #f8f9fa;
        }

        .container {
            max-width: 1200px;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">Taxi System Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Admin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Driver</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">User</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <!-- Admin Section -->
        <div class="section-header">
            <h2>Admin Dashboard</h2>
        </div>
        <div class="card shadow-sm mb-4">
            <div class="card-header">Admin Actions</div>
            <div class="card-body">
                <button class="btn btn-primary btn-custom" onclick="fetchDrivers()">
                    <i class="fa fa-users"></i> Show All Drivers
                </button>
                <button class="btn btn-primary btn-custom" onclick="fetchUsers()">
                    <i class="fa fa-users"></i> Show All Users
                </button>
                <button class="btn btn-danger btn-custom" data-bs-toggle="modal" data-bs-target="#deleteUserModal">
                    <i class="fa fa-trash"></i> Delete User
                </button>
                <button class="btn btn-danger btn-custom" data-bs-toggle="modal" data-bs-target="#deleteDriverModal">
                    <i class="fa fa-trash"></i> Delete Driver
                </button>
            </div>
        </div>

        <!-- Driver Section -->
        <div class="section-header">
            <h2>Driver Dashboard</h2>
        </div>
        <div class="card shadow-sm mb-4">
            <div class="card-header">Driver Actions</div>
            <div class="card-body">
                <button class="btn btn-success btn-custom" onclick="registerDriver()">
                    <i class="fa fa-user-plus"></i> Register as Driver
                </button>
                <button class="btn btn-success btn-custom" onclick="loginDriver()">
                    <i class="fa fa-sign-in"></i> Login as Driver
                </button>
                <button class="btn btn-info btn-custom" onclick="acceptBooking()">
                    <i class="fa fa-check-circle"></i> Accept Booking
                </button>
                <button class="btn btn-info btn-custom" onclick="viewAvailableRides()">
                    <i class="fa fa-car"></i> View Available Rides
                </button>
                <button class="btn btn-info btn-custom" onclick="completeRide()">
                    <i class="fa fa-flag-checkered"></i> Complete Ride
                </button>
            </div>
        </div>

        <!-- User Section -->
        <div class="section-header">
            <h2>User Dashboard</h2>
        </div>
        <div class="card shadow-sm mb-4">
            <div class="card-header">User Actions</div>
            <div class="card-body">
                <button class="btn btn-primary btn-custom" onclick="registerUser()">
                    <i class="fa fa-user-plus"></i> Register as User
                </button>
                <button class="btn btn-primary btn-custom" onclick="loginUser()">
                    <i class="fa fa-sign-in"></i> Login as User
                </button>
                <button class="btn btn-primary btn-custom" onclick="bookRide()">
                    <i class="fa fa-taxi"></i> Book a Ride
                </button>
                <button class="btn btn-warning btn-custom" onclick="rateDriver()">
                    <i class="fa fa-star"></i> Rate a Driver
                </button>
            </div>
        </div>
    </div>

    <!-- Modal for Delete User -->
    <div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteUserModalLabel">Delete User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="text" class="form-control" placeholder="Enter User ID" id="userId" />
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" onclick="deleteUser()">Confirm Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Delete Driver -->
    <div class="modal fade" id="deleteDriverModal" tabindex="-1" aria-labelledby="deleteDriverModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteDriverModalLabel">Delete Driver</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="text" class="form-control" placeholder="Enter Driver ID" id="driverId" />
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" onclick="deleteDriver()">Confirm Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript for Handling Interactions -->
    <script>
        function fetchDrivers() {
            // Add logic to interact with your API (GET /admin/drivers)
            console.log("Fetching drivers...");
        }

        function fetchUsers() {
            // Add logic to interact with your API (GET /admin/users)
            console.log("Fetching users...");
        }

        function deleteUser() {
            const userId = document.getElementById("userId").value;
            if (!userId) {
                alert("Please enter a user ID.");
                return;
            }
            console.log(`Deleting user with ID: ${userId}`);
            // Add logic to interact with your API (DELETE /admin/users/:id)
        }

        function deleteDriver() {
            const driverId = document.getElementById("driverId").value;
            if (!driverId) {
                alert("Please enter a driver ID.");
                return;
            }
            console.log(`Deleting driver with ID: ${driverId}`);
            // Add logic to interact with your API (DELETE /admin/drivers/:id)
        }

        function registerDriver() {
            console.log("Registering driver...");
            // Add logic to interact with your API (POST /drivers/register)
        }

        function loginDriver() {
            console.log("Logging in as driver...");
            // Add logic to interact with your API (POST /drivers/login)
        }

        function acceptBooking() {
            const rideId = prompt("Enter ride ID to accept:");
            console.log(`Accepting ride with ID: ${rideId}`);
            // Add logic to interact with your API (POST /drivers/acceptBook)
        }

        function viewAvailableRides() {
            console.log("Fetching available rides...");
            // Add logic to interact with your API (GET /drivers/available-rides)
        }

        function completeRide() {
            const rideId = prompt("Enter ride ID to complete:");
            console.log(`Completing ride with ID: ${rideId}`);
            // Add logic to interact with your API (PATCH /drivers/complete-ride)
        }

        function registerUser() {
            console.log("Registering user...");
            // Add logic to interact with your API (POST /users/register)
        }

        function loginUser() {
            console.log("Logging in as user...");
            // Add logic to interact with your API (POST /auth/login)
        }

        function bookRide() {
            console.log("Booking ride...");
            // Add logic to interact with your API (POST /users/book)
        }

        function rateDriver() {
            const rideId = prompt("Enter ride ID to rate:");
            const rating = prompt("Enter rating (1-5):");
            console.log(`Rating ride with ID: ${rideId} and rating: ${rating}`);
            // Add logic to interact with your API (POST /users/rate-driver)
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
